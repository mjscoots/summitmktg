    </style>
    <!-- Pass 222 - a real first screen in the HTML source, so a cold visitor sees
         the message and can reach the application before any script runs. It is
         removed only when the cover component mounts; nothing else clears it. -->
    <div id="boot-cover">
      <h1>Pest control. Fiber internet. Life insurance.</h1>
      <p>Where being a sales rep is not the end goal.</p>
      <a href="/apply/rookie">Get in</a>
    </div>
    <script>
      // Anyone arriving straight at another route never sees the home message.
      // This runs while parsing, before the first paint.
      if (location.pathname !== '/') {
        var b = document.getElementById('boot-cover');
        if (b) { b.remove(); window.__bootRemovedAt = performance.now(); }
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
