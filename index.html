    <style>
      #boot-cover{position:fixed;inset:0;z-index:40;background:#000000;text-align:center;font-family:Archivo,system-ui,-apple-system,sans-serif}
      #boot-cover p{position:absolute;top:clamp(84px,12svh,118px);left:50%;width:min(92vw,820px);transform:translateX(-50%);margin:0;color:rgba(255,255,255,.72);font-size:15px;font-weight:500;line-height:1.4;letter-spacing:0;white-space:nowrap}
      #boot-cover a{position:absolute;top:calc(clamp(84px,12svh,118px) + 48px);left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 26px;border-radius:999px;background:#1B6CF2;color:#ffffff;font-size:1rem;font-weight:700;text-decoration:none;opacity:0;visibility:hidden;animation:boot-apply-reveal 0s 3000ms forwards}
      @keyframes boot-apply-reveal{to{opacity:1;visibility:visible}}
      @media(min-width:700px){#boot-cover p{font-size:17px}}
    </style>
    <!-- Pass 222 - a real first screen in the HTML source, so a cold visitor sees
         the small line before any script runs, with a delayed failure-mode link. It is
         removed only when the cover component mounts; nothing else clears it. -->
    <div id="boot-cover">
      <p>Pest control. Fiber internet. Life insurance.</p>
      <a href="/apply/rookie">Apply</a>
    </div>
    <script>
      // Anyone arriving straight at another route never sees the home message.
      // This runs while parsing, before the first paint.
      if (location.pathname !== '/') {
        var b = document.getElementById('boot-cover');
        if (b) { b.remove(); window.__bootRemovedAt = performance.now(); }
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
